name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TrainingTracker.sln

      - name: Build
        run: dotnet build TrainingTracker.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test TrainingTracker.sln --no-build --configuration Release

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training-tracker-client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: training-tracker-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
